name: tibb
description: "Tibb — a private inbox you message yourself. No account, no cloud."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# Dependency discipline: every package below maps to a brief requirement.
# See docs/DECISION_LOG.md (ADR-004) for why each one is here and what was rejected.
dependencies:
  flutter:
    sdk: flutter

  # Local database with FTS5 (bundled SQLite, so FTS5 is guaranteed on iOS).
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Capture
  file_picker: ^10.0.0
  image_picker: ^1.1.2
  record: ^6.0.0
  just_audio: ^0.9.40
  video_player: ^2.9.1

  # Privacy & portability
  local_auth: ^2.3.0
  crypto: ^3.0.5
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  archive: ^3.6.1

  # Out-of-app
  share_plus: ^10.1.4
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8

  # Monetization — RevenueCat. Test Store needs >= 9.8.0; 10.x adds
  # trackCustomPaywallImpression, used by our custom paywall.
  purchases_flutter: ^10.13.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/bridge/
    - assets/fonts/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
